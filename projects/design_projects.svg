<svg width="1200" height="700" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">

<defs>
    <linearGradient id="background" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0f172a"/>
        <stop offset="50%" stop-color="#1e40af"/>
        <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <filter id="shadow">
        <feGaussianBlur stdDeviation="8"/>
    </filter>
</defs>


<!-- Background -->
<rect width="1200" height="700" fill="url(#background)"/>


<!-- Decorative circles -->
<circle cx="150" cy="120" r="80" fill="#ffffff" opacity="0.08"/>
<circle cx="1050" cy="580" r="120" fill="#ffffff" opacity="0.08"/>


